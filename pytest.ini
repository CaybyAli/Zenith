[pytest]
addopts = -m "not ffmpeg_integration and not real_whisper and not shorts_render_integration"
markers =
    smoke: smoke tests
    ffmpeg_integration: requires real ffmpeg/moviepy rendering and is skipped by default
    real_whisper: optional real Whisper/faster-whisper tests; skip when local model/runtime is unavailable
    local_llm: Tests that require a local LLM server
    shorts_render_integration: marks tests that perform real ffmpeg shorts rendering
testpaths = tests
norecursedirs =
    .git
    .pytest_cache
    pytest-cache-files-*
